  <h1 class="blog-title">CIF Imports to Trinidad &amp; Tobago:<br><em>Port, Logistics &amp; Duty Guide</em></h1>
  <div class="blog-author">Vector Trade Capital Trade Desk · Houston, TX</div>
</header>

<article class="article-body">
  <div class="breadcrumb"><a href="../index.html">Home</a><span class="breadcrumb-sep">/</span><a href="../blog.html">Resources</a><span class="breadcrumb-sep">/</span><span>CIF Trinidad & Tobago</span></div>

  <p class="article-lead">Trinidad and Tobago is the Caribbean's most industrialized economy and a major hub for commodity imports and re-exports across the Southern Caribbean. With a GDP driven by energy production, petrochemicals, and manufacturing, the twin-island nation has strong purchasing power and well-developed <a href="../blog/caribbean-port-infrastructure-guide.html" style="color:var(--teal)">port infrastructure</a> for handling bulk cargo. This guide covers how to structure CIF imports to Trinidad — ports, routing, duties, documentation, and typical commodities.</p>

  <nav style="background:rgba(26,122,94,0.04);padding:24px;border-radius:8px;margin:32px 0">
    <strong style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)">Table of Contents</strong>
    <ol style="margin-top:12px;padding-left:20px;font-size:14px;line-height:2;color:rgba(14,26,20,0.65)">
      <li><a href="#ports" style="color:var(--teal)">Port of Spain & Point Lisas</a></li>
      <li><a href="#routing" style="color:var(--teal)">Vessel Routing from US Gulf Coast</a></li>
      <li><a href="#commodities" style="color:var(--teal)">Typical Import Commodities</a></li>
      <li><a href="#duties" style="color:var(--teal)">Customs Duties & CARICOM Tariffs</a></li>
      <li><a href="#documentation" style="color:var(--teal)">Documentation Requirements</a></li>
      <li><a href="#faq" style="color:var(--teal)">FAQ</a></li>
    </ol>
  </nav>

  <h2 id="ports">Port of Spain & Point Lisas</h2>

  <h3>Port of Port of Spain</h3>
  <p>The capital's port handles the majority of Trinidad's containerized general cargo. Located on the Gulf of Paria, Port of Spain receives container vessels, break-bulk carriers, and reefer vessels. The port is operated by the Port Authority of Trinidad and Tobago (<a href="https://www.patnt.com/" rel="noopener noreferrer" target="_blank" style="color:var(--teal)">PATT</a>) and has berth depths of 9-12 meters, accommodating Panamax-class vessels. For food commodity importers, Port of Spain is the primary discharge point for containerized rice, flour, sugar, cooking oil, frozen proteins, and consumer goods.</p>

  <h3>Point Lisas Industrial Port</h3>
  <p>Point Lisas is Trinidad's industrial heartland — home to the Point Lisas Industrial Estate, one of the largest industrial complexes in the Caribbean. The port handles bulk liquid cargo (fuel, petrochemicals, LNG) and dry bulk commodities. For <a href="../lp/trinidad-fuel.html" style="color:var(--teal)">fuel imports</a>, Point Lisas is the preferred discharge point due to its tank farm infrastructure and pipeline connections. Industrial buyers sourcing raw materials for manufacturing also receive cargo here. Point Lisas has dedicated liquid bulk berths with draft up to 12.5 meters.</p>

  <h3>Scarborough (Tobago)</h3>
  <p>Tobago's smaller port at Scarborough handles supplemental food and consumer goods imports for the island's 60,000 residents and tourism sector. Most Tobago-bound cargo transits through Port of Spain and is ferried across the 20-mile strait.</p>

  <h2 id="routing">Vessel Routing from US Gulf Coast</h2>

  <p>The US Gulf Coast to Trinidad is a direct, well-served shipping lane with multiple weekly sailings from major container lines. Typical routing:</p>
  <ul>
    <li><strong>Houston → Port of Spain:</strong> 5-7 days direct, or 6-8 days via transshipment at Kingston</li>
    <li><strong>Miami → Port of Spain:</strong> 4-5 days with direct service</li>
    <li><strong>New Orleans → Port of Spain:</strong> 5-7 days</li>
  </ul>
  <p>For fuel cargo, product tankers load at USGC terminals (Houston Ship Channel, Corpus Christi, or Lake Charles) and sail direct to Point Lisas — typically 5-6 days. Tanker scheduling is coordinated with the receiving terminal's tank availability. See our <a href="../blog/caribbean-fuel-supply-chain.html" style="color:var(--teal)">Caribbean fuel supply chain guide</a> for detailed procurement logistics.</p>

  <h2 id="commodities">Typical Import Commodities</h2>

  <h3>Food Commodities</h3>
  <p>Trinidad imports substantial volumes of <a href="../lp/rice.html" style="color:var(--teal)">rice</a> (parboiled, primarily from Guyana and the US), <a href="../lp/wheat-flour.html" style="color:var(--teal)">wheat flour</a>, <a href="../lp/sugar.html" style="color:var(--teal)">sugar</a>, <a href="../lp/cooking-oil.html" style="color:var(--teal)">cooking oil</a>, <a href="../lp/poultry.html" style="color:var(--teal)">frozen poultry</a>, and dairy products. The country's food processing sector — including flour mills, sugar refineries, and beverage manufacturers — sources raw materials internationally for value-added production. Trinidad also serves as a re-export hub, with processed foods distributed to smaller Eastern Caribbean islands.</p>

  <h3>Fuel & Energy</h3>
  <p>Despite being an energy producer, Trinidad imports specific refined petroleum products to meet domestic demand gaps. <a href="../lp/trinidad-fuel.html" style="color:var(--teal)">ULSD diesel, gasoline, and specialty fuel products</a> are imported CIF to Point Lisas and Port of Spain for industrial users, power generation, and re-export. Trinidad's Petrotrin refinery has undergone structural changes, creating import opportunities for refined products that were previously produced domestically.</p>

  <h3>Vehicles & Equipment</h3>
  <p>New and used <a href="../vehicles.html" style="color:var(--teal)">vehicles</a> from US dealers and auctions ship via RoRo or container to Port of Spain. Trinidad's automotive market favors right-hand-drive vehicles, but left-hand-drive US-origin vehicles are also imported for commercial and fleet use.</p>

  <div style="background:var(--teal-pale);padding:28px;border-radius:8px;margin:32px 0;text-align:center">
    <p style="font-size:16px;color:var(--ink);margin:0 0 16px"><strong>Importing to Trinidad?</strong></p>
    <p style="font-size:14px;color:rgba(14,26,20,0.6);margin:0 0 16px">Get a 48-hour CIF quote for food or fuel delivery to Port of Spain or Point Lisas.</p>
    <a href="../lp/trinidad-fuel.html" style="display:inline-block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--teal);color:white;padding:12px 28px;border-radius:24px;text-decoration:none;margin:0 6px">Fuel Quote</a>
    <a href="../lp/food.html" style="display:inline-block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);padding:12px 28px;border-radius:24px;text-decoration:none;border:1px solid var(--teal);margin:0 6px">Food Quote</a>
  </div>

  <h2 id="duties">Customs Duties & CARICOM Tariffs</h2>

  <p>Trinidad and Tobago applies the <a href="https://caricom.org/common-external-tariff/" rel="noopener noreferrer" target="_blank" style="color:var(--teal)">CARICOM Common External Tariff (CET)</a> on imports from non-CARICOM countries. Key rates for common commodities:</p>
  <ul>
    <li><strong>Rice:</strong> 0-25% depending on origin and CARICOM preference</li>
    <li><strong>Wheat flour:</strong> 0-15%</li>
    <li><strong>Cooking oil:</strong> 0-5% on crude oil for refining; higher on refined</li>
    <li><strong>Sugar:</strong> Variable, subject to CARICOM sugar protocol</li>
    <li><strong>Frozen poultry:</strong> 0-40% depending on cut and trade agreement</li>
    <li><strong>Diesel/gasoline:</strong> Fuel levy + customs duty, administered by the Ministry of Energy</li>
  </ul>
  <p>Imports from CARICOM member states may qualify for preferential (zero) duty under the CARICOM Single Market and Economy (CSME). US-origin goods are subject to the full CET rate unless covered by a bilateral or WTO agreement. The <a href="https://www.customs.gov.tt/" rel="noopener noreferrer" target="_blank" style="color:var(--teal)">Trinidad and Tobago Customs and Excise Division</a> publishes current tariff schedules.</p>
  <p>In addition to customs duty, importers pay Value Added Tax (VAT) at 12.5% on most goods. Essential food items (rice, flour, certain cooking oils) may be zero-rated or exempt.</p>

  <h2 id="documentation">Documentation Requirements</h2>

  <p>Trinidad Customs requires the following for food and fuel imports:</p>
  <ul>
    <li><strong>Customs Declaration (C82/C84):</strong> Filed electronically through the ASYCUDA system</li>
    <li><strong>Commercial invoice:</strong> Showing FOB value, freight, and insurance separately</li>
    <li><strong>Bill of lading:</strong> Original or express release</li>
    <li><strong>Certificate of origin:</strong> Required for preferential tariff claims</li>
    <li><strong>CARICOM invoice:</strong> For goods qualifying for CARICOM preference</li>
    <li><strong>Phytosanitary certificate:</strong> For grains, legumes, flour (issued by exporting country's agriculture ministry)</li>
    <li><strong>Health certificate:</strong> For proteins (issued by USDA FSIS for US-origin)</li>
    <li><strong>Import permit:</strong> Required for certain controlled items including some food products</li>
    <li><strong>Certificate of analysis:</strong> For oils, dairy, sugar — showing compliance with Trinidad Bureau of Standards (TTBS) requirements</li>
  </ul>
  <p>VTC handles all export-side documentation. For <a href="../blog/letters-of-credit-caribbean-trade.html" style="color:var(--teal)">payment instruments</a> including LCs and DA terms, see our trade finance guide. For broader compliance context, see our <a href="caribbean-trade-compliance.html" style="color:var(--teal)">Caribbean trade compliance guide</a>.</p>

  <h2 id="faq">Frequently Asked Questions</h2>

  <div style="border-bottom:1px solid var(--border-light);padding:20px 0">
    <h3 style="font-size:16px;font-weight:500;margin-bottom:8px">What commodities can be imported CIF to Trinidad?</h3>
    <p style="font-size:14px;color:rgba(14,26,20,0.6);line-height:1.8">Fuel (ULSD, gasoline, LPG), food (rice, flour, sugar, oil, poultry), vehicles, and industrial materials. CIF delivery to Port of Spain, Point Lisas, and Scarborough.</p>
  </div>
  <div style="border-bottom:1px solid var(--border-light);padding:20px 0">
    <h3 style="font-size:16px;font-weight:500;margin-bottom:8px">How long does shipping take from the US to Trinidad?</h3>
    <p style="font-size:14px;color:rgba(14,26,20,0.6);line-height:1.8">5-7 days from Houston, 4-5 days from Miami. Direct container services run weekly from major carriers.</p>
  </div>
  <div style="border-bottom:1px solid var(--border-light);padding:20px 0">
    <h3 style="font-size:16px;font-weight:500;margin-bottom:8px">What are import duties on food in Trinidad?</h3>
    <p style="font-size:14px;color:rgba(14,26,20,0.6);line-height:1.8">CARICOM CET rates apply. Essential foods (rice, flour) are typically 0-5%. Frozen poultry can be 0-40% depending on cut and trade agreements. VAT is 12.5% on most goods; essential foods may be exempt.</p>
  </div>
  <div style="border-bottom:1px solid var(--border-light);padding:20px 0">
    <h3 style="font-size:16px;font-weight:500;margin-bottom:8px">What documentation does Trinidad Customs require?</h3>
    <p style="font-size:14px;color:rgba(14,26,20,0.6);line-height:1.8">C82/C84 customs declaration (ASYCUDA), commercial invoice, B/L, COO, phyto/health certificates, import permit (certain items), and CARICOM invoice for preferential rates.</p>
  </div>
  <div style="border-bottom:1px solid var(--border-light);padding:20px 0">
    <h3 style="font-size:16px;font-weight:500;margin-bottom:8px">Can VTC deliver fuel CIF to Point Lisas?</h3>
    <p style="font-size:14px;color:rgba(14,26,20,0.6);line-height:1.8">Yes. VTC evaluates fuel supply to Trinidad on a per-transaction basis. ULSD, gasoline, and other products can be delivered CIF to Point Lisas and Port of Spain. Contact our trade desk.</p>
  </div>
